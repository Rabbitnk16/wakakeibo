<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>わかけいぼ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf6f1; --card: #ffffff; --ink: #2f2a26; --sub: #8a8078; --line: #ece4da; --soft: #f3ede6;
  --accent: #d9774b; --accent-ink: #ffffff;
  --oie: #4f9d69; --oie-bg: #e7f3ea;
  --che: #3d7fc4; --che-bg: #e5eef9;
  --wata: #d45d8c; --wata-bg: #fbe8f0;
  --warn: #b7791f; --warn-bg: #fdf3dc;
  --e1: #d8694a; --e1-bg: #fbe9e2; --e2: #5f9a3e; --e2-bg: #e9f3e1; --e3: #4a7fc0; --e3-bg: #e4edf8; --e4: #8a5cc4; --e4-bg: #efe7f8;
  --over: #d0473d; --ok: #3f8f5a;
  --shadow: 0 1px 2px rgba(60,40,20,.06), 0 4px 16px rgba(60,40,20,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1d1a18; --card: #282422; --ink: #f1ebe5; --sub: #a59a90; --line: #3a3430; --soft: #322d2a;
    --accent: #e98a5f; --accent-ink: #1d1a18;
    --oie: #6fc08a; --oie-bg: #21352a; --che: #6ea6e0; --che-bg: #1f2e40; --wata: #ec86ae; --wata-bg: #3d2430;
    --warn: #e2b04a; --warn-bg: #3a2f17;
    --e1: #ef8c6c; --e1-bg: #3a2620; --e2: #8cc46a; --e2-bg: #233220; --e3: #78a8e6; --e3-bg: #1f2b3b; --e4: #b28be6; --e4-bg: #2d2340;
    --over: #f07a70; --ok: #6fc08a;
    --shadow: none;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: "Zen Maru Gothic", -apple-system, "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif; font-size: 15px; line-height: 1.5;
  padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
button, input, select, textarea { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }

header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(10px + env(safe-area-inset-top)) 16px 8px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.brand { font-weight: 700; font-size: 17px; }
.month { display: flex; align-items: center; gap: 4px; }
.month b { font-size: 16px; min-width: 7.5em; text-align: center; }
.iconbtn { border: 0; background: var(--card); width: 34px; height: 34px; border-radius: 50%; box-shadow: var(--shadow); font-size: 15px; cursor: pointer; }
.iconbtn:disabled { opacity: .3; }
.period { color: var(--sub); font-size: 12px; text-align: right; margin-top: 2px; }

main { padding: 4px 16px 16px; max-width: 560px; margin: 0 auto; }
.card { background: var(--card); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 12px; }
h2 { font-size: 14px; color: var(--sub); margin: 18px 4px 8px; font-weight: 700; }
.muted { color: var(--sub); font-size: 13px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 6; background: var(--card); border-top: 1px solid var(--line);
  display: flex; padding-bottom: env(safe-area-inset-bottom); }
nav button { flex: 1; border: 0; background: none; padding: 8px 0 10px; font-size: 11px; color: var(--sub); cursor: pointer; position: relative; }
nav button .ic { display: block; font-size: 20px; line-height: 1.3; filter: grayscale(1); opacity: .6; }
nav button.on { color: var(--accent); font-weight: 700; }
nav button.on .ic { filter: none; opacity: 1; }
.badge { position: absolute; top: 4px; left: 50%; margin-left: 6px; background: var(--accent); color: var(--accent-ink); border-radius: 9px; font-size: 10px; min-width: 18px; padding: 0 5px; line-height: 18px; font-weight: 700; }

/* 振り分け */
.progress { height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; margin: 6px 0 14px; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.sortcard { text-align: center; padding: 22px 16px 16px; }
.sortcard .date { color: var(--sub); font-size: 13px; }
.sortcard .name { font-size: 20px; font-weight: 700; margin: 6px 0 2px; word-break: break-all; }
.sortcard .orig { color: var(--sub); font-size: 12px; word-break: break-all; }
.sortcard .amt { font-size: 32px; font-weight: 700; margin: 10px 0 6px; }
.chip { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 10px; background: var(--soft); color: var(--sub); }
.chip.new { background: var(--warn-bg); color: var(--warn); }
.whobtns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; }
.whobtn { border: 2px solid transparent; border-radius: 14px; padding: 14px 4px; font-weight: 700; font-size: 16px; cursor: pointer; }
.whobtn small { display: block; font-size: 11px; font-weight: 500; opacity: .8; }
.w-oie { background: var(--oie-bg); color: var(--oie); }
.w-che { background: var(--che-bg); color: var(--che); }
.w-wata { background: var(--wata-bg); color: var(--wata); }
.whobtn.sug { border-color: currentColor; }
.whobtn:active { transform: scale(.97); }
.subacts { display: flex; justify-content: center; gap: 18px; margin-top: 14px; }
.link { border: 0; background: none; color: var(--sub); font-size: 13px; padding: 6px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.done { text-align: center; padding: 36px 16px; }
.done .big { font-size: 40px; }

/* 明細一覧 */
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; }
.chips button { border: 1px solid var(--line); background: var(--card); border-radius: 16px; padding: 5px 12px; font-size: 13px; white-space: nowrap; cursor: pointer; }
.chips button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.search { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 9px 12px; margin-bottom: 10px; }
.list { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
.item { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
.item:last-child { border-bottom: 0; }
.dot { width: 8px; align-self: stretch; border-radius: 4px; flex: none; }
.dot.oie { background: var(--oie); } .dot.che { background: var(--che); } .dot.wata { background: var(--wata); } .dot.none { background: var(--line); }
.item .mid { flex: 1; min-width: 0; }
.item .t { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .s { color: var(--sub); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .a { font-weight: 700; white-space: nowrap; }
.tag { font-size: 11px; padding: 0 6px; border-radius: 6px; background: var(--warn-bg); color: var(--warn); margin-left: 4px; }
.empty { text-align: center; color: var(--sub); padding: 28px; }

/* シート（下から出る編集画面） */
.veil { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; display: none; }
.veil.on { display: block; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--card); border-radius: 20px 20px 0 0;
  padding: 10px 16px calc(16px + env(safe-area-inset-bottom)); max-height: 88vh; overflow-y: auto; transform: translateY(105%); transition: transform .25s; max-width: 560px; margin: 0 auto; }
.sheet.on { transform: none; }
.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 10px; }
label.f { display: block; font-size: 12px; color: var(--sub); margin: 14px 0 4px; }
.in { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 12px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button { border: 2px solid transparent; border-radius: 12px; padding: 9px 0; font-weight: 700; cursor: pointer; opacity: .55; }
.seg button.on { opacity: 1; border-color: currentColor; }
.toggle { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; cursor: pointer; }
.toggle input { width: 18px; height: 18px; accent-color: var(--accent); }
.orig-box { background: var(--soft); border-radius: 12px; padding: 10px 12px; font-size: 12px; color: var(--sub); margin-top: 14px; word-break: break-all; }
.btns { display: flex; gap: 8px; margin-top: 18px; }
.btn { flex: 1; border: 0; border-radius: 14px; padding: 13px; font-weight: 700; cursor: pointer; background: var(--soft); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .5; }

/* まとめ */
.hero { text-align: center; padding: 20px 16px; }
.hero .lbl { font-size: 13px; color: var(--che); font-weight: 700; }
.hero .big { font-size: 34px; font-weight: 700; margin: 2px 0; }
.alert { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 9px 12px; font-size: 13px; margin-bottom: 10px; cursor: pointer; }
.calc { width: 100%; border-collapse: collapse; }
.calc td { padding: 6px 0; border-bottom: 1px dashed var(--line); }
.calc tr:last-child td { border-bottom: 0; }
.calc td:last-child { text-align: right; font-weight: 700; white-space: nowrap; }
.calc tr.tot td { font-size: 16px; border-top: 1px solid var(--ink); border-bottom: 0; padding-top: 8px; }
.calc .op { color: var(--sub); width: 2em; white-space: nowrap; }
.whohead { font-weight: 700; margin-bottom: 6px; }
.fx { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px dashed var(--line); cursor: pointer; }
.fx:last-child { border-bottom: 0; }
.fx .n { flex: 1; min-width: 0; }
.fx .n small { display: block; color: var(--sub); font-size: 11px; }
.fx .v { font-weight: 700; }
.fx .v.todo { color: var(--warn); }
.fxgroup { font-size: 12px; color: var(--sub); margin-top: 10px; font-weight: 700; }
.fxgroup:first-child { margin-top: 0; }
.legend { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 13px; margin-top: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
svg text { fill: var(--sub); font-size: 10px; font-family: inherit; }

/* 予算 */
.enemy { border-radius: 18px; overflow: hidden; background: var(--card); box-shadow: var(--shadow); margin-bottom: 12px; }
.enemy .eh { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
.ebadge { width: 30px; height: 30px; border-radius: 50%; color: #fff; font-weight: 700; display: grid; place-items: center; flex: none; font-size: 15px; }
.enemy .eh .nm { flex: 1; min-width: 0; font-weight: 700; }
.enemy .eh .nm small { display: block; font-weight: 500; font-size: 11px; opacity: .8; }
.enemy .eh .tot { text-align: right; font-weight: 700; white-space: nowrap; }
.enemy .eh .tot small { display: block; font-size: 11px; font-weight: 500; }
.enemy .eb { padding: 4px 14px 10px; }
.brow { padding: 9px 0; border-bottom: 1px dashed var(--line); }
.brow:last-child { border-bottom: 0; }
.brow .l { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.brow .l b { font-weight: 700; }
.bar { height: 7px; background: var(--soft); border-radius: 4px; overflow: hidden; margin: 6px 0 3px; position: relative; }
.bar i { display: block; height: 100%; border-radius: 4px; }
.brow .r { display: flex; justify-content: space-between; font-size: 12px; color: var(--sub); }
.over { color: var(--over); font-weight: 700; } .under { color: var(--ok); font-weight: 700; }
.bighead { text-align: center; padding: 18px 16px; }
.bighead .lbl { font-size: 13px; color: var(--sub); }
.bighead .big { font-size: 30px; font-weight: 700; margin: 2px 0; }
.bedit .cat { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.bedit .cat .cn { font-size: 14px; font-weight: 700; }
.bedit .cat .hint { font-size: 11px; color: var(--sub); grid-column: 1 / 3; display: flex; justify-content: space-between; }
.bedit .cat input { width: 112px; text-align: right; }
.bedit select.esel { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; font-size: 11px; padding: 2px 4px; }
.eseg { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.eseg button { border: 2px solid transparent; border-radius: 10px; padding: 7px 0; font-size: 12px; font-weight: 700; cursor: pointer; background: var(--soft); color: var(--sub); }
.eseg button.on { border-color: currentColor; }

/* ちぇちゃんが払った分 */
.chebtn { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; border-radius: 16px; padding: 12px 14px; margin-bottom: 10px;
  background: var(--che-bg); color: var(--che); font-weight: 700; cursor: pointer; text-align: left; }
.chebtn .ic2 { font-size: 22px; }
.chebtn small { display: block; font-weight: 500; font-size: 12px; opacity: .85; }
.tag.che { background: var(--che-bg); color: var(--che); }
.cam { display: flex; gap: 8px; }
.cam label { flex: 1; display: block; text-align: center; border: 2px dashed var(--che); color: var(--che); border-radius: 14px; padding: 14px 6px; font-weight: 700; cursor: pointer; }
.cam input { display: none; }
.halfnote { background: var(--che-bg); color: var(--che); border-radius: 12px; padding: 9px 12px; font-size: 13px; margin-top: 14px; }
details.raw { font-size: 11px; color: var(--sub); margin-top: 8px; }
details.raw pre { white-space: pre-wrap; background: var(--soft); padding: 8px; border-radius: 8px; max-height: 160px; overflow: auto; }

/* まとめ（折りたたみ） */
.sumrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px dashed var(--line); }
.sumrow:last-child { border-bottom: 0; }
.sumrow small { display: block; color: var(--sub); font-size: 11px; font-weight: 500; }
.sumrow > b { font-size: 19px; white-space: nowrap; }
.alert a { cursor: pointer; display: inline-block; padding: 2px 0; }
details.fold { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); margin-bottom: 10px; overflow: hidden; }
details.fold summary { list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 14px 16px; cursor: pointer; font-weight: 700; }
details.fold summary::-webkit-details-marker { display: none; }
details.fold summary::before { content: '▸'; color: var(--sub); margin-right: 2px; transition: transform .2s; display: inline-block; }
details.fold[open] summary::before { transform: rotate(90deg); }
details.fold summary > span:first-child { flex: 1; }
.foldbody { padding: 0 16px 14px; }
.calc td.sec, .calc td.sec:last-child { font-weight: 700; padding-top: 12px; border-bottom: 0; text-align: left; }

/* 取り込み */
.drop { display: block; border: 2px dashed var(--line); border-radius: 18px; padding: 26px 16px; text-align: center; cursor: pointer; background: var(--card); }
.drop b { display: block; font-size: 16px; margin-bottom: 4px; }
.drop input { display: none; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
.kv dt { color: var(--sub); } .kv dd { margin: 0; text-align: right; font-weight: 700; }
ol.steps { padding-left: 20px; margin: 6px 0 0; font-size: 13px; color: var(--sub); }
ol.steps li { margin: 3px 0; }

.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); opacity: 0;
  background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 20px; font-size: 13px; z-index: 30; transition: .25s; pointer-events: none; max-width: 90vw; text-align: center; }
.toast.on { opacity: 1; transform: translateX(-50%); }
.loading { text-align: center; padding: 60px 0; color: var(--sub); }
.spin { display: inline-block; width: 22px; height: 22px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: sp 0.8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.stale #mlabel::after { content: ' ⟳'; opacity: .45; font-weight: 400; }
</style>

<style>
.install { margin: 0 16px 10px; background: var(--card); border-radius: 14px; padding: 10px 12px; font-size: 13px; box-shadow: var(--shadow); display: flex; gap: 8px; align-items: center; }
.install b { color: var(--accent); }
.install button { border: 0; background: none; color: var(--sub); font-size: 18px; cursor: pointer; }

window.WK_API = "https://script.google.com/macros/s/AKfycbyZpZGq61U6PdOH8C3E9pPEHap9X8q302PCT56CZsVuV2fqsqVFt93lrto6M0hcURtmzQ/exec";

})();
if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js?v=0d70893c'); });

<body>
<header>
  <div class="top">
    <div class="brand"><span id="eto">🐴</span> わかけいぼ</div>
    <div class="month">
      <button class="iconbtn" id="prev" aria-label="前の月">‹</button>
      <b id="mlabel">…</b>
      <button class="iconbtn" id="next" aria-label="次の月">›</button>
    </div>
  </div>
  <div class="period" id="mperiod"></div>
</header>

<div class="install" id="install" hidden><span>📲 <b>ホーム画面に追加</b>するとアプリみたいに使えるよ：iPhoneは下の <b>共有ボタン</b> →「ホーム画面に追加」</span><button aria-label="閉じる" onclick="this.parentNode.remove()">×</button></div>
<script>

  var standalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;

</script>

  <button data-tab="sort"><span class="ic">🗂️</span>振り分け<span class="badge" id="bdg" hidden></span></button>

<script>
var WHO = [
  { key: 'お家', short: 'お家', cls: 'oie', note: '折半' },
  { key: 'ちぇちゃん', short: 'ちぇ', cls: 'che', note: 'ちぇちゃん' },
  { key: 'わたちゃん', short: 'わた', cls: 'wata', note: 'わたちゃん' }
];
var ENEMIES = {
  1: { name: '毎月の固定費', sub: '家賃・スマホ代・サブスク など', unit: '' },
  2: { name: '毎月の変動費', sub: '食費・日用品・美容 など', unit: '月' },
  3: { name: '不定期の固定費', sub: '年会費・税金・更新料 など', unit: '年' },
  4: { name: '不定期の変動費', sub: '旅行・家電・冠婚葬祭 など', unit: '年' }
};
var CAT_COLORS = ['#d9774b', '#4f9d69', '#3d7fc4', '#d45d8c', '#b7791f', '#7a6bc4', '#3aa3a3', '#c45a5a', '#8a9a3c', '#9a7a62', '#5f7f9a', '#b08acb', '#7d8b8f', '#c9a14a'];
var S = { bw: '家族', tab: 'sort', periods: [], period: '', categories: [], m: null, filter: '全部', q: '', skipped: {}, imp: null, log: null, busy: false };

/* ---------- サーバー呼び出し ---------- */
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  // スマホのアプリ（PWA）版：合言葉をつけてApps Scriptに送る
  if (window.WK_API) {
    return fetch(window.WK_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ k: window.WK_KEY, fn: fn, args: args }) })

/** iPhoneの写真（HEIC）はブラウザによって開けないので、先にJPEGに変換する */
function isHeic(f) { return /hei[cf]/i.test(f.type || '') || /\.hei[cf]$/i.test(f.name || ''); }
var heicLib = null;
function heicToJpeg(f) {
  $('c-ocr').innerHTML = '<span class="spin" style="width:14px;height:14px;border-width:2px;vertical-align:-2px"></span> iPhoneの写真を変換中…（はじめは少し時間がかかる）';
  heicLib = heicLib || new Promise(function (ok, ng) {
    var sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/heic-to@1.6.7/dist/iife/heic-to.js';
    sc.onload = function () { ok(window.HeicTo); }; sc.onerror = function () { heicLib = null; ng(new Error('変換の部品を読み込めなかった')); };
    document.head.appendChild(sc);
  });
  return heicLib.then(function (H) { return H({ blob: f, type: 'image/jpeg', quality: 0.85 }); }).then(function (b) {
    $('c-ocr').innerHTML = '<span class="spin" style="width:14px;height:14px;border-width:2px;vertical-align:-2px"></span> 読み取り中…（10秒くらい）';
    return b;
  });
}
function shrink(file, max) {
  return new Promise(function (ok, ng) {
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      var sc = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    img.onerror = function () { URL.revokeObjectURL(url); ng(new Error('画像を開けなかった（' + (file.type || file.name || '形式不明') + '）')); };
    img.src = url;
  });
}

    }).join('') + '</select>';
    h += '<p class="muted">月シートと同じく「' + label(p.period) + '」＝' + md(info(p.period).pay) + '払いの明細、という扱い</p>';
    h += '<div class="btns"><button class="btn" onclick="S.imp=null;render()">やめる</button><button class="btn primary" id="imp-go" onclick="commitImp()"' + (p.fresh ? '' : ' disabled') + '>' + (p.fresh ? p.fresh + '件を取り込む' : '新しい明細はないよ') + '</button></div></div>';
    return h;
  }
  if (S.imp && S.imp.loading) return '<div class="card loading"><span class="spin"></span><div>読み込み中…</div></div>';
  h += '<h2 style="margin-top:4px">ちぇちゃんが払った分</h2>' + '<button class="chebtn" onclick="openChe()"><span class="ic2">📷</span><span>ちぇちゃんが払った分を入れる<small>d払い・現金で払ったお家の物。半分はわたちゃん負担になるよ</small></span></button>';
  h += '<h2>わたちゃんが現金で払った分</h2><button class="chebtn" onclick="openCash()"><span class="ic2">💴</span><span>現金で払った分を入れる<small>美容院など、カードの明細に出てこない支払い</small></span></button>';
  h += '<h2>dカードの明細</h2>';
  h += '<label class="drop"><b>📥 明細のCSVを選ぶ</b><span class="muted">dカードのサイトからダウンロードしたファイル</span><input type="file" accept=".csv,text/csv" onchange="pickFile(this)"></label>';
  h += '<div class="card" style="margin-top:12px"><b>やりかた</b><ol class="steps"><li>dカードのサイトかアプリにログイン</li><li>「ご利用明細」で月を選んで <b>CSVダウンロード</b></li><li>上のボタンからそのファイルを選ぶ</li><li>「振り分け」で要確認の分だけタップ</li></ol>';
  h += '<p class="muted" style="margin-bottom:0">同じファイルを2回入れても、取り込み済みの明細は自動で飛ばすから大丈夫。</p></div>';
  h += '<h2>最近の取り込み</h2>';
  if (!S.log) { call('getImportLog').then(function (l) { S.log = l; if (S.tab === 'imp') render(); }).catch(fail); return h + '<div class="list"><div class="empty">…</div></div>'; }
  h += '<div class="list">' + (S.log.length ? S.log.map(function (l) {
    return '<div class="item" style="cursor:default"><div class="mid"><div class="t">' + esc(l.file) + '</div><div class="s">' + esc(l.at) + ' ・ ' + esc(label(l.period) || l.period) + '</div></div><div class="a num" style="font-size:13px">+' + l.added + '件' + (l.dup ? '<div class="muted">重複' + l.dup + '</div>' : '') + '</div></div>';
  }).join('') : '<div class="empty">まだないよ</div>') + '</div>';
  return h;
}
function pickFile(inp) {
  var f = inp.files[0]; if (!f) return;
  if (f.size > 2 * 1024 * 1024) return toast('ファイルが大きすぎるよ（2MBまで）');
  S.imp = { loading: true }; render();
  var rd = new FileReader();
  rd.onload = function () {
    var b64 = String(rd.result).split(',')[1];
    call('previewImport', f.name, b64).then(function (p) { S.imp = { preview: p }; render(); }).catch(function (e) { S.imp = null; fail(e); });
  };
  rd.readAsDataURL(f);
}
function commitImp() {
  var p = S.imp.preview, per = $('imp-period').value;
  $('imp-go').disabled = true; $('imp-go').textContent = '取り込み中…';
  call('commitImport', p.token, per).then(function (r) {
    S.imp = null; S.log = null; S.tab = r.review ? 'sort' : 'sum'; setMonth(r.month);
    toast(r.added + '件取り込んだよ' + (r.replaced ? '（速報' + r.replaced + '件を置き換え）' : '') + (r.review ? '・要確認' + r.review + '件' : ''));
  }).catch(function (e) { S.imp = null; fail(e); });
}
function pad(n) { return (n < 10 ? '0' : '') + n; }
function shift(p, d) { var y = +p.slice(0, 4), m = +p.slice(5) - 1 + d; return (y + Math.floor(m / 12)) + '-' + pad((m % 12 + 12) % 12 + 1); }
function label(p) { return /^\d{4}-\d{2}$/.test(p) ? +p.slice(0, 4) + '年' + +p.slice(5) + '月分' : ''; }
function info(p) { var n = shift(p, 1); return { pay: n.slice(0, 4) + '/' + n.slice(5) + '/10' }; }

/* ---------- タブ・月の切り替え ---------- */
function go(tab) { S.tab = tab; render(); window.scrollTo(0, 0); }
$('tabs').onclick = function (e) { var b = e.target.closest('button'); if (b) go(b.dataset.tab); };
function changeMonth(d) {
  var p = shift(S.period, d);
  $('view').innerHTML = '<div class="loading"><span class="spin"></span></div>';
  call('getMonth', p).then(setMonth).catch(fail);
}
$('prev').onclick = function () { changeMonth(-1); };
$('next').onclick = function () { changeMonth(1); };

// 起動を速く（2026-11-18）：前回の画面をこの端末に覚えておいて、すぐ出す。裏で最新を読んで入れ替える
var BOOT_KEY = 'wk_boot_' + String(window.WK_KEY || 'gas').slice(0, 8), booted = false;
function startApp(b, fromCache) {
  S.periods = b.periods; S.categories = b.categories; S.role = b.role || 'wata';
  if (!booted) {
    if (S.role === 'che') {
      $('tabs').innerHTML = '<button data-tab="ckakei"><span class="ic">📊</span>今月の家計</button><button data-tab="csum"><span class="ic">💙</span>今月の精算</button><button data-tab="cpay"><span class="ic">📷</span>払った分</button>';
      S.tab = 'ckakei';
    }
    booted = true;
    setMonth(b.month);
    if (S.role !== 'che' && !undecided().length) S.tab = 'sum', render();
    if (fromCache) document.body.classList.add('stale');
    return;
  }
  document.body.classList.remove('stale');
  // 2回目（最新が届いた）：同じ月を見ていて、編集中でなければ入れ替える
  if (S.period === b.month.info.period && !$('sheet').classList.contains('on')) { var tab = S.tab; setMonth(b.month); S.tab = tab; render(); }
}
try { var cachedBoot = JSON.parse(localStorage.getItem(BOOT_KEY) || 'null'); if (cachedBoot && cachedBoot.month) startApp(cachedBoot, true); } catch (e) {}
(window.WK_KEY ? call('getBootstrap') : new Promise(function () {})).then(function (b) {
  try { localStorage.setItem(BOOT_KEY, JSON.stringify(b)); } catch (e) {}
  startApp(b, false);
}).catch(function (e) {
  if (booted) { document.body.classList.remove('stale'); toast('⚠️ 最新を読めなかった（前に見た内容を表示中）'); return; }
  $('view').innerHTML = '<div class="card">⚠️ 読み込めなかった：' + esc(e && e.message || e) + '</div>';
});
</script>
</body>
</html>
